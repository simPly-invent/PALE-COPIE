# Construit PÂLE COPIE pour Windows, macOS et Linux et publie une release GitHub.
# Déclenchement : pousser un tag de version (ex. : git tag v0.9.1 && git push origin v0.9.1),
# ou lancer le workflow à la main depuis l'onglet « Actions » (les builds sont alors des artefacts).
#
# Windows et Linux sont exportés sur Linux. macOS est exporté et signé sur un Mac :
# une signature faite depuis Linux est vue comme « endommagée » par les Mac récents.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot et les modèles d'export
        run: |
          set -e
          V="${GODOT_VERSION}"
          MIRROR="https://downloads.godotengine.org/?version=${V}&flavor=stable"
          GH="https://github.com/godotengine/godot/releases/download/${V}-stable"
          curl -fsSL -o godot.zip "${MIRROR}&slug=linux.x86_64.zip&platform=linux.64" \
            || curl -fsSL -o godot.zip "${GH}/Godot_v${V}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${MIRROR}&slug=export_templates.tpz&platform=templates" \
            || curl -fsSL -o templates.tpz "${GH}/Godot_v${V}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${V}-stable_linux.x86_64" godot
          chmod +x godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          ./godot --version

      - name: Importer le projet
        run: ./godot --headless --import || ./godot --headless --import

      - name: Vérifier les scripts
        run: |
          ./godot --headless --quit 2>&1 | tee check.log
          if grep -E "SCRIPT ERROR|Parse Error" check.log; then exit 1; fi

      - name: Tests de cohérence
        run: |
          timeout 300 ./godot --headless res://tests/run_tests.tscn 2>&1 | tee tests.log
          grep -q "ALL TESTS PASSED" tests.log

      - name: Exporter Windows et Linux
        run: |
          set -e
          mkdir -p build/windows build/linux dist
          ./godot --headless --export-release "Windows Desktop" build/windows/PaleCopie.exe
          ./godot --headless --export-release "Linux" build/linux/PaleCopie.x86_64
          ls -la build/*

      - name: Vérifier que le build Linux démarre
        run: |
          chmod +x build/linux/PaleCopie.x86_64
          timeout 60 build/linux/PaleCopie.x86_64 --headless --quit-after 600 -- --skip-intro 2>&1 | tee run.log || true
          if grep -E "SCRIPT ERROR|Salle inconnue|JSON invalide" run.log; then exit 1; fi

      - name: Empaqueter
        run: |
          set -e
          NAME="PaleCopie-${GITHUB_REF_NAME//\//-}"
          (cd build/windows && zip -qr "../../dist/${NAME}-windows.zip" .)
          (cd build/linux && zip -qr "../../dist/${NAME}-linux.zip" .)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: builds-windows-linux
          path: dist/*

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot et les modèles d'export
        run: |
          set -e
          V="${GODOT_VERSION}"
          MIRROR="https://downloads.godotengine.org/?version=${V}&flavor=stable"
          GH="https://github.com/godotengine/godot/releases/download/${V}-stable"
          curl -fsSL -o godot.zip "${MIRROR}&slug=macos.universal.zip&platform=macos.universal" \
            || curl -fsSL -o godot.zip "${GH}/Godot_v${V}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "${MIRROR}&slug=export_templates.tpz&platform=templates" \
            || curl -fsSL -o templates.tpz "${GH}/Godot_v${V}-stable_export_templates.tpz"
          ditto -x -k godot.zip .
          TPL="$HOME/Library/Application Support/Godot/export_templates/${V}.stable"
          mkdir -p "$TPL"
          unzip -q templates.tpz
          mv templates/* "$TPL/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          ./Godot.app/Contents/MacOS/Godot --version

      - name: Importer le projet
        run: $GODOT --headless --import || $GODOT --headless --import

      - name: Exporter, signer et empaqueter macOS
        run: |
          set -e
          NAME="PaleCopie-${GITHUB_REF_NAME//\//-}"
          mkdir -p build/macos dist
          $GODOT --headless --export-release "macOS" build/macos/export.zip
          cd build/macos
          ditto -x -k export.zip .
          APP="$(find . -maxdepth 1 -name '*.app' | head -n 1)"
          echo "Application : $APP"
          # signature ad hoc par l'outil d'Apple (sans compte développeur)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # ditto conserve la signature (zip la casserait)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "../../dist/${NAME}-macos.zip"
          ls -la ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: builds-macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Builds de PÂLE COPIE (${{ github.ref_name }}).

            - **Windows** : décompresser, lancer `PaleCopie.exe` (si Windows affiche « application non reconnue » : *Informations complémentaires* → *Exécuter quand même*).
            - **macOS** : décompresser, puis **clic droit sur l'application → Ouvrir** la première fois. Si macOS refuse encore : *Réglages Système → Confidentialité et sécurité → Ouvrir quand même*. En dernier recours, dans le Terminal : `xattr -cr ` puis glisser l'application dans la fenêtre et Entrée.
            - **Linux** : décompresser, `chmod +x PaleCopie.x86_64`, puis lancer.
